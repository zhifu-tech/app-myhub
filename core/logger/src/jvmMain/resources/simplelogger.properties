# SLF4J Simple Logger 配置（备用）
# 
# 注意：当前使用 Logback，此配置文件不会生效。
# 如果需要切换回 slf4j-simple，请：
# 1. 修改 core/logger/build.gradle.kts，将 logback 替换为 slf4j.simple
# 2. 此配置文件会生效，logback.xml 会被忽略
#
# 设置默认日志级别为 DEBUG（开发环境）
org.slf4j.simpleLogger.defaultLogLevel=debug

# 设置特定包的日志级别
org.slf4j.simpleLogger.log.tech.zhifu.app.myhub=debug
org.slf4j.simpleLogger.log.Myhub=debug
org.slf4j.simpleLogger.log.MyHub=debug
org.slf4j.simpleLogger.log.ZhifuTech=debug

# 显示日期时间
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS

# 显示线程名
org.slf4j.simpleLogger.showThreadName=true

# 显示日志名称（简化）
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=true

# 显示日志级别
org.slf4j.simpleLogger.showSimpleName=true
