<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>MyHub - Capture Processing</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
    rel="stylesheet"/>
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    primary: "#D0BCFF",
                    onPrimary: "#381E72",
                    "surface-dark": "#141218",
                    "surface-variant": "#49454F",
                    "on-surface": "#E6E1E5",
                    "on-surface-variant": "#CAC4D0",
                    "background-dark": "#0f0f11",
                },
                fontFamily: {
                    sans: ["Inter", "sans-serif"],
                    serif: ["Playfair Display", "serif"],
                    mono: ["JetBrains Mono", "monospace"],
                },
                borderRadius: {
                    DEFAULT: "0.75rem",
                    'xl': '1rem',
                    '2xl': '1.5rem',
                },
            },
        },
    };
  </script>
  <style>
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background-color: rgba(156, 163, 175, 0.3);
        border-radius: 20px;
    }
    .material-symbols-filled {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body
  class="bg-background-dark text-on-surface font-sans h-screen flex overflow-hidden selection:bg-primary selection:text-onPrimary">
<div class="flex-1 flex overflow-hidden relative">
  <main class="flex-1 h-full flex flex-col relative overflow-y-auto scroll-smooth">
    <header class="flex justify-between items-center p-6 lg:p-10 shrink-0">
      <button class="p-2 -ml-2 text-[#E6E1E5] hover:bg-[#49454F]/30 rounded-full transition-colors">
        <span class="material-symbols-outlined text-2xl">close</span>
      </button>
      <div class="flex gap-3">
        <button
          class="px-6 py-2.5 text-sm font-medium bg-[#1D1B20] text-[#E6E1E5]/50 border border-[#49454F]/50 rounded-full flex items-center gap-3 cursor-not-allowed transition-all shadow-none"
          disabled="">
          <div
            class="w-4 h-4 border-2 border-[#E6E1E5]/30 border-t-[#E6E1E5] rounded-full animate-spin"></div>
          Processing...
        </button>
      </div>
    </header>
    <div
      class="flex-1 flex flex-col justify-center items-center w-full max-w-3xl mx-auto px-6 lg:px-10 pb-20 relative">
      <div class="absolute inset-0 z-20 flex flex-col items-center justify-center">
        <div class="relative w-20 h-20 mb-8 flex items-center justify-center">
          <div class="absolute inset-0 border-4 border-primary/20 rounded-full"></div>
          <div
            class="absolute inset-0 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
          <span
            class="material-symbols-outlined text-3xl text-primary animate-pulse">auto_awesome</span>
        </div>
        <div class="text-center space-y-2">
          <h2 class="text-xl font-medium text-primary tracking-tight animate-pulse">AI is analyzing
            your intent</h2>
          <p class="text-[#CAC4D0] font-light">and structuring the asset...</p>
        </div>
      </div>
      <div
        class="w-full space-y-8 opacity-10 filter blur-[2px] pointer-events-none select-none transition-all duration-700">
        <div class="relative group">
          <textarea
            class="w-full bg-transparent border-0 border-b border-[#49454F] text-[#E6E1E5] text-3xl md:text-4xl font-light placeholder-[#49454F] focus:ring-0 resize-none leading-tight py-4 pl-0 pr-0 transition-all duration-300 focus:border-transparent placeholder-opacity-50"
            rows="3">Reviewing the new architectural plans for the downtown project. The lighting details in the lobby are particularly striking.</textarea>
          <div class="absolute bottom-0 left-0 h-[1px] w-full bg-[#49454F]"></div>
          <div
            class="absolute bottom-0 left-0 h-[2px] w-full bg-gradient-to-r from-primary/50 via-primary to-primary/50 shadow-[0_0_15px_rgba(208,188,255,0.5)]"></div>
        </div>
        <div class="flex items-center gap-6">
          <div class="relative group/thumb">
            <div
              class="w-20 h-20 rounded-2xl bg-[#2B2930] border border-[#49454F] overflow-hidden shadow-lg relative">
              <img alt="Architecture Reference"
                   class="w-full h-full object-cover hover:scale-110 transition-transform duration-500"
                   src="https://lh3.googleusercontent.com/aida-public/AB6AXuD2i1YOL9ncbA5PaFbRI4Goja3bYAvPZy-rLvZ7O2-onNQ4T_aJ36zuw0owJNG-HK1b7U_7ZlrvtSs0XwRMuEB8O3DCd7v6bTlENwNrWDApOoDeT2ZrKciqloE1uyyeHZx4qPSTKgaqqKSSwOIjZrau2OKcUfxLn7JzyHBFHkpZ7hHdAjuVxqb02Nycz7K5bvXXxpLH1J1G-buJIunC3JLUYkxcZDBXIRuUU5lWw4EQ4sIAJOjLLETu0A8cOjXEfrHbrSoYNUk2Crs"/>
            </div>
          </div>
          <button
            class="flex items-center gap-3 pl-4 pr-6 py-3.5 rounded-2xl bg-[#2B2930] hover:bg-[#36343B] text-[#E6E1E5] transition-all group border border-[#49454F]/50 hover:border-primary/30 hover:shadow-[0_4px_20px_rgba(0,0,0,0.4)]">
            <div
              class="w-8 h-8 rounded-full bg-[#49454F]/40 group-hover:bg-primary group-hover:text-onPrimary flex items-center justify-center transition-colors">
              <span class="material-symbols-outlined text-xl">add</span>
            </div>
            <span class="text-base font-medium tracking-wide">Add Media</span>
          </button>
        </div>
      </div>
    </div>
  </main>
  <aside
    class="w-[420px] bg-[#1D1B20] border-l border-[#49454F] p-8 hidden xl:flex flex-col shadow-2xl z-20 h-full relative overflow-hidden">
    <div
      class="absolute top-0 right-0 w-full h-64 bg-gradient-to-b from-primary/5 to-transparent pointer-events-none"></div>
    <div class="flex-1 flex flex-col justify-center items-center w-full">
      <div
        class="w-full bg-[#252329] rounded-2xl border border-[#49454F]/50 p-6 relative overflow-hidden transition-all duration-500 hover:shadow-[0_0_20px_rgba(208,188,255,0.05)]">
        <div
          class="absolute inset-0 bg-gradient-to-tr from-transparent via-primary/5 to-transparent animate-pulse"></div>
        <div class="flex gap-4 mb-6 relative z-10">
          <div class="w-12 h-12 rounded-xl bg-[#49454F]/40 animate-pulse"></div>
          <div class="flex-1 space-y-2 py-1">
            <div class="h-3 bg-[#49454F]/40 rounded w-3/4 animate-pulse"></div>
            <div class="h-2 bg-[#49454F]/30 rounded w-1/2 animate-pulse"></div>
          </div>
        </div>
        <div class="space-y-3 mb-6 relative z-10">
          <div class="h-3 bg-[#49454F]/30 rounded w-full animate-pulse"></div>
          <div class="h-3 bg-[#49454F]/30 rounded w-full animate-pulse"></div>
          <div class="h-3 bg-[#49454F]/30 rounded w-5/6 animate-pulse"></div>
          <div class="h-3 bg-[#49454F]/30 rounded w-4/6 animate-pulse"></div>
        </div>
        <div
          class="w-full aspect-video rounded-xl bg-[#49454F]/20 animate-pulse relative overflow-hidden border border-[#49454F]/20 z-10">
          <div
            class="absolute inset-0 bg-gradient-to-r from-transparent via-[#49454F]/20 to-transparent skew-x-[-20deg] translate-x-[-150%] animate-[pulse_2s_ease-in-out_infinite]"></div>
        </div>
        <div class="absolute top-4 right-4 flex gap-1 z-10">
          <div class="w-1.5 h-1.5 rounded-full bg-primary/40 animate-bounce"></div>
          <div
            class="w-1.5 h-1.5 rounded-full bg-primary/40 animate-bounce [animation-delay:0.2s]"></div>
          <div
            class="w-1.5 h-1.5 rounded-full bg-primary/40 animate-bounce [animation-delay:0.4s]"></div>
        </div>
      </div>
      <div class="mt-8 text-center opacity-80">
        <p
          class="text-primary/90 text-sm font-medium animate-pulse flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-lg">auto_awesome</span>
          Generating structured asset...
        </p>
      </div>
    </div>
  </aside>
</div>
</body>
</html>
