<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>MyHub - Minimalist Capture v2</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
    rel="stylesheet"/>
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    primary: "#B4A3FF", // Updated primary
                    onPrimary: "#381E72",
                    "surface-dark": "#1C1B1F", // Left content surface
                    "surface-variant": "#2D2E33", // Right preview side-sheet
                    "on-surface": "#E6E1E5", // Main text
                    "on-surface-variant": "#CAC4D0", // Secondary/placeholder text
                    "background-dark": "#131316", // Modal Background
                    "outline": "#938F99", // Divider and outlines
                    "secondary-container": "#4A4458", // Add Media button bg
                    "on-secondary-container": "#E8DEF8", // Add Media button text
                },
                fontFamily: {
                    sans: ["Inter", "sans-serif"],
                    serif: ["Playfair Display", "serif"],
                    mono: ["JetBrains Mono", "monospace"],
                },
                borderRadius: {
                    DEFAULT: "0.75rem",
                    'xl': '1rem',
                    '2xl': '1.5rem',
                },
            },
        },
    };
  </script>
  <style>
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background-color: rgba(147, 143, 153, 0.3);border-radius: 20px;
    }
    .material-symbols-filled {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body
  class="bg-background-dark text-on-surface font-sans h-screen flex overflow-hidden selection:bg-primary selection:text-onPrimary">
<div class="flex-1 flex overflow-hidden relative">
  <main class="flex-1 h-full flex flex-col relative overflow-y-auto scroll-smooth bg-surface-dark">
    <header class="flex justify-between items-center p-6 lg:p-10 shrink-0">
      <button
        class="p-2 -ml-2 text-on-surface hover:bg-surface-variant/30 rounded-full transition-colors">
        <span class="material-symbols-outlined text-2xl">close</span>
      </button>
      <div class="flex gap-3">
        <button
          class="px-6 py-2.5 text-sm font-medium bg-surface-variant/40 text-on-surface-variant cursor-not-allowed rounded-full transition-all flex items-center gap-2 ring-1 ring-outline opacity-50"
          disabled="">
          <span class="material-symbols-outlined text-lg">check</span>
          Capture
        </button>
      </div>
    </header>
    <div
      class="flex-1 flex flex-col justify-center items-center w-full max-w-3xl mx-auto px-6 lg:px-10 pb-20">
      <div class="w-full space-y-10">
        <div class="relative group">
          <textarea autofocus=""
                    class="w-full bg-transparent border-0 border-b border-outline text-on-surface text-3xl md:text-4xl font-light placeholder-on-surface-variant focus:ring-0 resize-none leading-tight py-4 pl-0 pr-4 transition-all duration-300 focus:border-transparent placeholder-opacity-50"
                    placeholder="What would you like to capture? Paste link or drop files"
                    rows="2"></textarea>
          <div class="absolute bottom-0 left-0 h-[1px] w-full bg-outline"></div>
          <div
            class="absolute bottom-0 left-0 h-[2px] w-0 bg-gradient-to-r from-primary/50 via-primary to-primary/50 transition-all duration-700 ease-out group-focus-within:w-full shadow-[0_0_15px_rgba(180,163,255,0.5)]"></div>
        </div>
        <div class="flex items-center justify-between">
          <button
            class="flex items-center gap-3 pl-4 pr-6 py-3.5 rounded-2xl bg-secondary-container hover:brightness-110 text-on-secondary-container transition-all group border border-transparent hover:shadow-[0_4px_20px_rgba(0,0,0,0.4)]">
            <div
              class="w-8 h-8 rounded-full bg-on-secondary-container/20 group-hover:bg-on-secondary-container group-hover:text-secondary-container flex items-center justify-center transition-colors">
              <span class="material-symbols-outlined text-xl">add</span>
            </div>
            <span class="text-base font-medium tracking-wide">Add Media</span>
          </button>
        </div>
      </div>
    </div>
  </main>
  <aside
    class="w-[420px] bg-surface-variant border-l border-outline p-8 hidden xl:flex flex-col shadow-2xl z-20 h-full relative overflow-hidden">
    <div
      class="absolute top-0 right-0 w-full h-64 bg-gradient-to-b from-primary/5 to-transparent pointer-events-none"></div>
    <div class="flex-1 flex flex-col justify-center items-center overflow-y-auto pr-2 text-center">
      <div class="relative mb-8">
        <div class="absolute inset-0 bg-primary/20 blur-2xl rounded-full animate-pulse"></div>
        <div
          class="w-20 h-20 rounded-full bg-surface-dark flex items-center justify-center border border-outline relative z-10 shadow-xl">
          <span class="material-symbols-outlined text-3xl text-on-surface-variant">filter_center_focus</span>
        </div>
      </div>
      <h3 class="text-lg font-medium text-on-surface mb-2 tracking-wide">Ready to Capture</h3>
      <p class="text-on-surface-variant text-sm max-w-[260px] leading-relaxed">
        Content will appear here for review.
      </p>
    </div>
  </aside>
</div>
</body>
</html>
