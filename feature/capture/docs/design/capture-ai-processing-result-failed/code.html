<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>MyHub - Minimalist Capture v2</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
    rel="stylesheet"/>
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    primary: "#D0BCFF",
                    onPrimary: "#381E72",
                    "surface-dark": "#141218",
                    "surface-variant": "#49454F",
                    "on-surface": "#E6E1E5",
                    "on-surface-variant": "#CAC4D0",
                    "background-dark": "#0f0f11",
                },
                fontFamily: {
                    sans: ["Inter", "sans-serif"],
                    serif: ["Playfair Display", "serif"],
                    mono: ["JetBrains Mono", "monospace"],
                },
                borderRadius: {
                    DEFAULT: "0.75rem",
                    'xl': '1rem',
                    '2xl': '1.5rem',
                },
            },
        },
    };
  </script>
  <style>
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background-color: rgba(156, 163, 175, 0.3);
        border-radius: 20px;
    }
    .material-symbols-filled {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body
  class="bg-background-dark text-on-surface font-sans h-screen flex overflow-hidden selection:bg-primary selection:text-onPrimary">
<div class="flex-1 flex overflow-hidden relative">
  <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-50">
    <div
      class="bg-[#313033] text-[#E6E1E5] px-4 py-3 rounded-[4px] shadow-xl flex items-center gap-4 min-w-[320px]">
      <p class="text-sm font-medium tracking-wide">AI Process failed. Please check your content or
        try again.</p>
      <button
        class="text-[#B4A3FF] font-medium text-sm hover:bg-[#B4A3FF]/10 px-2 py-1 rounded transition-colors uppercase">
        RETRY
      </button>
      <button class="p-1 -mr-2 text-[#E6E1E5] hover:bg-white/10 rounded-full transition-colors">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>
  </div>
  <main class="flex-1 h-full flex flex-col relative overflow-y-auto scroll-smooth">
    <header class="flex justify-between items-center p-6 lg:p-10 shrink-0">
      <button class="p-2 -ml-2 text-[#E6E1E5] hover:bg-[#49454F]/30 rounded-full transition-colors">
        <span class="material-symbols-outlined text-2xl">close</span>
      </button>
      <div class="flex gap-3">
        <button
          class="px-6 py-2.5 text-sm font-medium bg-primary text-onPrimary hover:bg-primary/90 cursor-pointer rounded-full transition-all flex items-center gap-2 shadow-[0_0_15px_rgba(208,188,255,0.3)]">
          <span class="material-symbols-outlined text-lg">check</span>
          Capture
        </button>
      </div>
    </header>
    <div
      class="flex-1 flex flex-col justify-center items-center w-full max-w-3xl mx-auto px-6 lg:px-10 pb-20">
      <div class="w-full space-y-8">
        <div class="relative group">
          <textarea autofocus=""
                    class="w-full bg-transparent border-0 border-b border-[#49454F] text-[#E6E1E5] text-3xl md:text-4xl font-light placeholder-[#49454F] focus:ring-0 resize-none leading-tight py-4 pl-0 pr-0 transition-all duration-300 focus:border-transparent placeholder-opacity-50"
                    rows="3">Reviewing the new architectural plans for the downtown project. The lighting details in the lobby are particularly striking.</textarea>
          <div class="absolute bottom-0 left-0 h-[1px] w-full bg-[#49454F]"></div>
          <div
            class="absolute bottom-0 left-0 h-[2px] w-full bg-gradient-to-r from-primary/50 via-primary to-primary/50 shadow-[0_0_15px_rgba(208,188,255,0.5)]"></div>
        </div>
        <div class="flex items-center gap-6">
          <div class="relative group/thumb">
            <div
              class="w-20 h-20 rounded-2xl bg-[#2B2930] border border-[#49454F] overflow-hidden shadow-lg relative">
              <img alt="Architecture Reference"
                   class="w-full h-full object-cover hover:scale-110 transition-transform duration-500"
                   src="https://lh3.googleusercontent.com/aida-public/AB6AXuD2i1YOL9ncbA5PaFbRI4Goja3bYAvPZy-rLvZ7O2-onNQ4T_aJ36zuw0owJNG-HK1b7U_7ZlrvtSs0XwRMuEB8O3DCd7v6bTlENwNrWDApOoDeT2ZrKciqloE1uyyeHZx4qPSTKgaqqKSSwOIjZrau2OKcUfxLn7JzyHBFHkpZ7hHdAjuVxqb02Nycz7K5bvXXxpLH1J1G-buJIunC3JLUYkxcZDBXIRuUU5lWw4EQ4sIAJOjLLETu0A8cOjXEfrHbrSoYNUk2Crs"/>
            </div>
            <button
              class="absolute -top-2 -right-2 w-6 h-6 bg-[#36343B] text-white rounded-full flex items-center justify-center border border-[#49454F] shadow-lg hover:bg-red-500/80 transition-colors z-20">
              <span class="material-symbols-outlined text-[14px]">close</span>
            </button>
          </div>
          <button
            class="flex items-center gap-3 pl-4 pr-6 py-3.5 rounded-2xl bg-[#2B2930] hover:bg-[#36343B] text-[#E6E1E5] transition-all group border border-[#49454F]/50 hover:border-primary/30 hover:shadow-[0_4px_20px_rgba(0,0,0,0.4)]">
            <div
              class="w-8 h-8 rounded-full bg-[#49454F]/40 group-hover:bg-primary group-hover:text-onPrimary flex items-center justify-center transition-colors">
              <span class="material-symbols-outlined text-xl">add</span>
            </div>
            <span class="text-base font-medium tracking-wide">Add Media</span>
          </button>
        </div>
      </div>
    </div>
  </main>
  <aside
    class="w-[420px] bg-[#1D1B20] border-l border-[#49454F] p-8 hidden xl:flex flex-col shadow-2xl z-20 h-full relative overflow-hidden">
    <div
      class="absolute top-0 right-0 w-full h-64 bg-gradient-to-b from-primary/5 to-transparent pointer-events-none"></div>
    <div class="flex-1 flex flex-col justify-center items-center overflow-y-auto pr-2 text-center">
      <div class="relative mb-8">
        <div class="absolute inset-0 bg-primary/20 blur-2xl rounded-full animate-pulse"></div>
        <div
          class="w-20 h-20 rounded-full bg-[#2B2930] flex items-center justify-center border border-[#49454F] relative z-10 shadow-xl">
          <span
            class="material-symbols-outlined text-3xl text-[#E6E1E5]/50">filter_center_focus</span>
        </div>
      </div>
      <h3 class="text-lg font-medium text-[#E6E1E5] mb-2 tracking-wide">Ready to Capture</h3>
      <p class="text-[#938F99] text-sm max-w-[260px] leading-relaxed">
        Content will appear here for review.
      </p>
    </div>
  </aside>
</div>
</body>
</html>
