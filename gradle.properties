#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M
kotlin.native.jvmargs=-Xmx8g
#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#iOS
kotlin.native.cacheKind.iosSimulatorArm64=none
# CocoaPods 配置（如果遇到 "CocoaPods executable not found" 错误，取消注释并设置正确的路径）
# org.jetbrains.kotlin.native.cocoapods.podCommand=/opt/homebrew/bin/pod
# CInterop Commonization（启用后可以在多个 iOS 架构之间共享 cinterop 绑定，减少代码重复，加快构建速度）
kotlin.mpp.enableCInteropCommonization=true
# ============================================================================
# 构建变体配置（Build Variant Configuration）
# ============================================================================
# 这些属性用于控制应用的构建变体，可以通过以下方式设置（优先级从高到低）：
# 1. 命令行参数：-PappEnv=prod -PappTier=premium -PappChannel=googlePlay
# 2. gradle.properties 文件（项目级配置，提交到版本控制）
# 3. ~/.gradle/gradle.properties 文件（用户级配置）
# 4. 代码中的默认值
#
# 环境维度（Environment）
# - dev: 开发环境，用于开发和测试
# - prod: 生产环境，用于正式发布
appEnv=dev
# 级别维度（Tier）
# - free: 免费版本，包含基础功能
# - premium: 高级版本，包含完整功能
appTier=free
# 渠道维度（Channel，可选）
# - channel: 默认渠道
# - googlePlay: Google Play 应用商店
# - umeng: 友盟统计（国内）
# 可以自定义其他渠道名称
appChannel=channel
# ============================================================================
# 平台按需加载配置（Platform Loading Configuration）
# ============================================================================
# 启用的平台
# 可选值: android, ios, jvm, js, wasmJs, server
# 默认: 所有平台
#
# 取值范围:
# 注意:
# - 修改此配置后需要重新同步 Gradle 项目
# - 也可以通过命令行参数临时覆盖: -PenabledPlatforms=android
# - 核心模块（core:*、feature:*、component:*）始终加载，不受此配置影响
# - Server 模块需要依赖 开启JVM
#enabledPlatforms=android
#enabledPlatforms=ios
#enabledPlatforms=jvm
#enabledPlatforms=js
#enabledPlatforms=wasmJs
#enabledPlatforms=jvm,server
