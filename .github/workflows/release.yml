name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.variant_label }} ${{ matrix.os_name }} Package
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_env: dev
            app_tier: free
            app_channel: channel
            variant_label: dev-free-channel
            os: macos-latest
            os_name: macOS
            jdk: "25"
            artifact_name: desktop-dmg-dev-free-channel
            package_path: composeApp/build/compose/binaries/main/dmg/*.dmg
          - app_env: dev
            app_tier: free
            app_channel: channel
            variant_label: dev-free-channel
            os: windows-latest
            os_name: Windows
            jdk: "25"
            artifact_name: desktop-msi-dev-free-channel
            package_path: composeApp/build/compose/binaries/main/msi/*.msi
          - app_env: prod
            app_tier: free
            app_channel: umeng
            variant_label: prod-free-umeng
            os: macos-latest
            os_name: macOS
            jdk: "25"
            artifact_name: desktop-dmg-prod-free-umeng
            package_path: composeApp/build/compose/binaries/main/dmg/*.dmg
          - app_env: prod
            app_tier: free
            app_channel: umeng
            variant_label: prod-free-umeng
            os: windows-latest
            os_name: Windows
            jdk: "25"
            artifact_name: desktop-msi-prod-free-umeng
            package_path: composeApp/build/compose/binaries/main/msi/*.msi
          - app_env: prod
            app_tier: free
            app_channel: googlePlay
            variant_label: prod-free-googlePlay
            os: macos-latest
            os_name: macOS
            jdk: "25"
            artifact_name: desktop-dmg-prod-free-googlePlay
            package_path: composeApp/build/compose/binaries/main/dmg/*.dmg
          - app_env: prod
            app_tier: free
            app_channel: googlePlay
            variant_label: prod-free-googlePlay
            os: windows-latest
            os_name: Windows
            jdk: "25"
            artifact_name: desktop-msi-prod-free-googlePlay
            package_path: composeApp/build/compose/binaries/main/msi/*.msi

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Print variant
        shell: bash
        run: |
          echo "APP_ENV=${{ matrix.app_env }}"
          echo "APP_TIER=${{ matrix.app_tier }}"
          echo "APP_CHANNEL=${{ matrix.app_channel }}"

      - name: Build desktop package
        shell: bash
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon --stacktrace -PappEnv=${{ matrix.app_env }} -PappTier=${{ matrix.app_tier }} -PappChannel=${{ matrix.app_channel }}

      - name: Upload ${{ matrix.os_name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.package_path }}
          if-no-files-found: error

  build-android:
    name: Build Android ${{ matrix.variant_label }} APK
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_env: dev
            app_tier: free
            app_channel: channel
            variant_label: dev-free-channel
          - app_env: prod
            app_tier: free
            app_channel: umeng
            variant_label: prod-free-umeng
          - app_env: prod
            app_tier: free
            app_channel: googlePlay
            variant_label: prod-free-googlePlay
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Print variant
        shell: bash
        run: |
          echo "APP_ENV=${{ matrix.app_env }}"
          echo "APP_TIER=${{ matrix.app_tier }}"
          echo "APP_CHANNEL=${{ matrix.app_channel }}"

      - name: Prepare Android release signing config
        shell: bash
        run: |
          if [ ! -f androidApp/release.properties ]; then
            if [ -f androidApp/release.properties.example ]; then
              cp androidApp/release.properties.example androidApp/release.properties
            fi
          fi

      - name: Build Android release APK
        shell: bash
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace -PenabledPlatforms=android -PappEnv=${{ matrix.app_env }} -PappTier=${{ matrix.app_tier }} -PappChannel=${{ matrix.app_channel }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.variant_label }}
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-desktop
      - build-android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Downloads

          ### Desktop
          - macOS: `.dmg`
          - Windows: `.msi`

          ### Android
          - `.apk`

          ## Notes
          - Desktop installers and Android APK are attached as release assets.
          - Use the file that matches your platform and variant.
          - Variants built in this release: `dev/free/channel`, `prod/free/umeng`, `prod/free/googlePlay`.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
