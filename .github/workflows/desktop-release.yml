name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.os_name }} Package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_name: macOS
            jdk: "25"
            artifact_name: desktop-dmg
            package_path: composeApp/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            os_name: Windows
            jdk: "25"
            artifact_name: desktop-msi
            package_path: composeApp/build/compose/binaries/main/msi/*.msi
          - os: ubuntu-latest
            os_name: Linux
            jdk: "25"
            artifact_name: desktop-deb
            package_path: composeApp/build/compose/binaries/main/deb/*.deb

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Build desktop package
        shell: bash
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon --stacktrace

      - name: Upload ${{ matrix.os_name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.package_path }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
