[versions]
# ============================================================================
# Build System & Kotlin
# ============================================================================
agp = "9.1.0-alpha05"
kotlin = "2.3.0"
composeMultiplatform = "1.9.3"
composeHotReload = "1.0.0"
# Compose Multiplatform Material 3 Adaptive 版本（KMP 支持）
composeMaterial3Adaptive = "1.2.0"

# ============================================================================
# Android SDK
# ============================================================================
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"

# ============================================================================
# AndroidX & Compose
# ============================================================================
androidx-activity = "1.12.2"
androidx-appcompat = "1.7.1"
androidx-core = "1.17.0"
jb-androidx-core-bundle = "1.1.0-alpha03"
androidx-lifecycle = "2.10.0"
jb-androidx-lifecycle = "2.10.0-alpha07"
savedstateCompose = "1.4.0-alpha01"
uiTooling = "1.10.1"
# Navigation 3 版本
androidx-compose-navigation3-adaptive = "1.3.0-alpha06"
jb-androidx-compose-navigation3-adaptive = "1.3.0-alpha03"
androidx-compose-material3-windowsize = "1.5.0-alpha11"
jb-compose-material3-windowsize = "1.11.0-alpha01"
androidx-navigation3 = "1.1.0-alpha01"
jb-androidx-navigation3 = "1.1.0-alpha01"
lifecycle-viewmodel-navigation3 = "2.1.0-alpha07"

# ============================================================================
# Testing
# ============================================================================
androidx-testExt = "1.3.0"
androidx-espresso = "3.7.0"
junit = "4.13.2"
robolectric = "4.16"

# ============================================================================
# Kotlin Multiplatform Common
# ============================================================================
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.9.0"
kotlinx-datetime = "0.7.1"
multiplatform-settings = "1.3.0"

# ============================================================================
# Dependency Injection
# ============================================================================
koin = "4.1.1"

# ============================================================================
# Logging
# ============================================================================
kotlin-logging = "7.0.14"
slf4j = "2.0.17"

# ============================================================================
# Persistence
# ============================================================================
sqldelight = "2.2.1"
postgresql = "42.7.8"

# ============================================================================
# Networking & Server
# ============================================================================
ktor = "3.3.3"
logback = "1.5.24"

# ============================================================================
# Google Services
# ============================================================================
googleServicesVersion = "4.4.2"
firebase-analytics = "2.4.0"
firebase-bom = "34.8.0"

# ============================================================================
# Umeng (友盟)
# ============================================================================
umeng-common = "9.8.9"
umeng-asms = "1.8.7.2"

[libraries]
# ============================================================================
# Build System Plugins
# ============================================================================
# Android Gradle 插件 API：提供构建 Android 应用和库的核心功能
android-gradleApiPlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }

# Kotlin Gradle 插件：Kotlin 编译器和标准库的 Gradle 插件
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
# Compose 编译器插件：Jetpack Compose 的编译器插件，用于编译 Compose 代码
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# ============================================================================
# Kotlin & Coroutines
# ============================================================================
# Kotlin 测试框架：提供 Kotlin 多平台测试的基础断言和测试工具
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# Kotlin JUnit 测试支持：为 Kotlin 测试提供 JUnit 集成
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
# Kotlin 协程核心库：提供协程的基础 API，包括挂起函数、协程作用域等
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
# Kotlin 协程测试工具：提供测试协程代码的工具，如 TestCoroutineDispatcher
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# Kotlin 协程 Swing 支持：为 Swing 应用提供协程集成，支持在 Swing 事件分发线程中使用协程
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
# Kotlin 序列化 JSON：提供 JSON 序列化和反序列化功能，支持多平台
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# Kotlin 日期时间库：提供跨平台的日期和时间处理 API
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }



# ============================================================================
# AndroidX core @ https://developer.android.com/jetpack/androidx/releases/core
# ============================================================================

## AndroidX Core KTX：提供 Kotlin 扩展函数，简化 Android 核心 API 的使用
#androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
#androidx-core-coreKtx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
#
## AndroidX Core Animation：提供属性动画相关的扩展和工具
#androidx-core-coreAnimation = { module = "androidx.core:core-animation", version.ref = "androidx-core" }
#
## AndroidX Core App：为应用级别的任务（如权限、通知、通知频道等）提供扩展
#androidx-core-coreApp = { module = "androidx.core:core-app", version.ref = "androidx-core" }
#
## AndroidX Core Content：为内容提供者、ClipData、Uri 等操作提供扩展
#androidx-core-coreContent = { module = "androidx.core:core-content", version.ref = "androidx-core" }
#
## AndroidX Core Role：提供角色管理的相关 API，例如管理默认的启动器、短信应用等
#androidx-core-coreRole = { module = "androidx.core:core-role", version.ref = "androidx-core" }
#
## AndroidX Core View：为视图相关的功能（如布局、视图属性动画等）提供扩展
#androidx-core-coreView = { module = "androidx.core:core-view", version.ref = "androidx-core" }
#
## JetBrains AndroidX Core Bundle：用于包含 Bundle 的支持
#jb-androidx-core-bundle = { module = "org.jetbrains.androidx.core:core-bundle", version.ref = "jb-androidx-core-bundle" }


## AndroidX AppCompat：提供向后兼容的 Activity 和 Fragment 支持
#androidx-appcompat-appcomapt = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
#
## AndroidX AppCompat Resources：提供向后兼容的资源管理功能
#androidx-appcompat-resources = { module = "androidx.appcompat:appcompat-resources", version.ref = "androidx-appcompat" }


# Activity Compose 集成：提供 Activity 与 Compose 的集成，包含 setContent 等 API
androidx-activity-activityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }


# -----------------------------------------------------------------------------
# AndroidX Lifecycle @ https://developer.android.com/jetpack/androidx/releases/lifecycle
# -----------------------------------------------------------------------------

# Lifecycle LifecycleRuntime：Lifecycle 核心基础库，提供生命周期状态管理
androidx-lifecycle-lifecycleRuntime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidx-lifecycle" }
jb-androidx-lifecycle-lifecycleRuntime = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime", version.ref = "jb-androidx-lifecycle" }

# Lifecycle LifecycleRuntimeCompose：为 Compose 提供生命周期感知能力，如 collectAsStateWithLifecycle
androidx-lifecycle-lifecycleRuntimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
jb-androidx-lifecycle-lifecycleRuntimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jb-androidx-lifecycle" }

## Lifecycle ViewModel：生命周期感知的 ViewModel（核心库）
#androidx-lifecycle-lifecycleViewModel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
#jb-androidx-lifecycle-lifecycleViewModel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "jb-androidx-lifecycle" }
#
## Lifecycle ViewModel Compose：为 Compose 提供 ViewModel 支持，支持在 Compose 中使用 ViewModel
#androidx-lifecycle-lifecycleViewModelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
jb-androidx-lifecycle-lifecycleViewModelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jb-androidx-lifecycle" }

## Lifecycle ViewModel SavedState：为 ViewModel 提供 SavedStateHandle 支持，实现状态保存与恢复
#androidx-lifecycle-lifecycleViewModelSavedState = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "androidx-lifecycle" }
#jb-androidx-lifecycle-lifecycleViewModelSavedState = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "jb-androidx-lifecycle" }
#
## 导航库 ViewModel 生命周期集成：将 ViewModel 的作用域绑定到导航回退栈条目 (NavEntry)
#androidx-lifecycle-lifecycleViewModelNavigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
#jb-androidx-lifecycle-lifecycleViewModelNavigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "jb-androidx-lifecycle" }
#
## Lifecycle ViewModelKtx：为 ViewModel 提供 Kotlin 扩展（如 viewModelScope）
#androidx-lifecycle-lifecycleViewModelKtx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
#
## Lifecycle 注解处理器：用于 Apt/KSP 编译期生成与 Lifecycle 相关的代码
#androidx-lifecycle-lifecycleCompiler = { module = "androidx.lifecycle:lifecycle-compiler", version.ref = "androidx-lifecycle" }
#
## Lifecycle LifecycleRuntimeKtx：为生命周期感知组件提供 Kotlin 扩展，简化协程/Flow 等的观测（如 repeatOnLifecycle）
#androidx-lifecycle-lifecycleRuntimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
#
## Lifecycle Service：为后台服务提供生命周期感知能力
#androidx-lifecycle-lifecycleService = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidx-lifecycle" }
#
## Lifecycle ReactiveStreams KTX：为 Lifecycle 组件提供 ReactiveStreams 支持（Kotlin 扩展）
#androidx-lifecycle-lifecycleReactiveStreamsKtx = { module = "androidx.lifecycle:lifecycle-reactivestreams-ktx", version.ref = "androidx-lifecycle" }
#
## Lifecycle 测试库：用于测试与 Lifecycle 相关的逻辑
#androidx-lifecycle-lifecycleRuntimeTesting = { module = "androidx.lifecycle:lifecycle-runtime-testing", version.ref = "androidx-lifecycle" }
#
## Lifecycle Process：为应用进程提供生命周期感知能力（如前后台切换）
#androidx-lifecycle-lifecycleProcess = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }



# -----------------------------------------------------------------------------
# AndroidX Compose Material3 material3-window-size-class
# https://developer.android.com/develop/ui/compose/layouts/adaptive/use-window-size-classes
# -----------------------------------------------------------------------------
#androidx-compose-material3-material3WindowSizeClass = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "androidx-compose-material3-windowsize" }
jb-compose-material3-material3WindowSizeClass = { group = "org.jetbrains.compose.material3", name = "material3-window-size-class", version.ref = "jb-compose-material3-windowsize" }

# -----------------------------------------------------------------------------
# AndroidX Compose Material3 Adaptive
# https://developer.android.com/jetpack/androidx/releases/compose-material3-adaptive?hl=zh-cn
# -----------------------------------------------------------------------------
# 自适应布局插件：支持 List-Detail (列表-详情) 等大屏适配的导航策略 SceneStrategy
#androidx-compose-material3-adaptive-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "androidx-compose-navigation3-adaptive" }
jb-compose-material3-adaptive-adaptive = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive", version.ref = "jb-androidx-compose-navigation3-adaptive" }

# 自适应布局：支持大屏自适应、窗口大小类推断等
#androidx-compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "androidx-compose-navigation3-adaptive" }
jb-compose-material3-adaptive-adaptiveLayout = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive-layout", version.ref = "jb-androidx-compose-navigation3-adaptive" }

# 自适应导航：支持 SceneStrategy、TwoPane 等响应式导航模式
androidx-compose-material3-adaptive-adaptiveNavigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "androidx-compose-navigation3-adaptive" }
jb-compose-material3-adaptive-adaptiveNavigation = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "jb-androidx-compose-navigation3-adaptive" }


# AndroidX Window 核心库：用于提供窗口和显示相关的 API（如折叠屏、屏幕分区支持）
#androidx-window-windowCore = { module = "androidx.window:window-core", version = "1.6.0-alpha01" }
jb-androidx-window-windowCore = { module = "org.jetbrains.androidx.window:window-core", version = "1.5.1" }



# Compose UI 工具：提供 Compose 的开发和调试工具，如布局检查器、实时预览等
androidx-compose-ui-uiTooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "uiTooling" }

# Compose UI 工具预览：提供 @Preview 注解支持，用于在 Android Studio 中预览 Compose UI
androidx-compose-ui-uiToolingPreview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "uiTooling" }

# SavedState Compose 支持：为 Compose 提供状态保存和恢复功能，支持配置变更时保持状态
jb-androidx-savedstate-compose = { module = "org.jetbrains.androidx.savedstate:savedstate-compose", version.ref = "savedstateCompose" }

# -----------------------------------------------------------------------------
# AndroidX Navigation @ https://developer.android.com/jetpack/androidx/releases/navigation3
# -----------------------------------------------------------------------------

## 导航库：核心运行时：包含 NavKey, NavEntry 等基础导航逻辑，不含 UI，只有所有平台
androidx-navigation3-navigation3Runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "androidx-navigation3" }
#
## 导航库 UI 容器：包含 NavDisplay, Scene 等核心组件，负责界面渲染与动画转换
#androidx-navigation3-navigation3Ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "androidx-navigation3" }
jb-androidx-navigation3-navigation3Ui = { group = "org.jetbrains.androidx.navigation3", name = "navigation3-ui", version.ref = "jb-androidx-navigation3" }


# ============================================================================
# Testing
# ============================================================================
# JUnit 测试框架：Java 单元测试框架，提供测试注解和断言
junit = { module = "junit:junit", version.ref = "junit" }
# AndroidX JUnit 扩展：提供 Android 特定的 JUnit 测试工具，如 AndroidJUnitRunner
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
# Espresso 核心：Android UI 自动化测试框架，用于编写 UI 交互测试
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }

# ============================================================================
# SQLDelight
# ============================================================================
# PostgreSQL JDBC 驱动：用于服务器端连接 PostgreSQL 数据库
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
# SQLDelight Android 驱动：为 Android 平台提供 SQLite 数据库驱动
sqldelight-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
# SQLDelight Native 驱动：为 iOS/macOS 等原生平台提供 SQLite 数据库驱动
sqldelight-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
# SQLDelight SQLite 驱动：为 JVM/桌面平台提供 SQLite 数据库驱动
sqldelight-sqlite = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
# SQLDelight Web 驱动：为 Web 平台提供基于 Web Worker 的数据库驱动
sqldelight-web = { module = "app.cash.sqldelight:web-worker-driver", version.ref = "sqldelight" }
# SQLDelight 协程扩展：提供 SQLDelight 与 Kotlin 协程的集成，支持挂起函数查询
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

# ============================================================================
# Dependency Injection
# ============================================================================
# Koin 核心库：轻量级依赖注入框架的核心模块，支持多平台
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
# Koin Compose ViewModel：为 Compose 提供 ViewModel 依赖注入支持
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
# Koin Android：为 Android 平台提供额外的依赖注入功能，如作用域管理
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

# ============================================================================
# Multiplatform Settings
# ============================================================================
# 多平台设置库：提供跨平台的键值对存储，支持 Android SharedPreferences、iOS UserDefaults 等
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatform-settings" }
# 多平台设置库（无参数）：提供类型安全的设置存储，无需手动序列化
multiplatform-settings-no-arg = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatform-settings" }

# ============================================================================
# Logging
# ============================================================================
# Kotlin 日志库：提供 Kotlin 多平台日志 API，支持结构化日志
kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlin-logging" }
# Kotlin 日志 Android 实现：为 Android 平台提供日志实现，输出到 Logcat
kotlin-logging-android = { module = "io.github.oshai:kotlin-logging-android", version.ref = "kotlin-logging" }
# SLF4J API：Java 日志门面 API，提供统一的日志接口
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
# SLF4J Simple 实现：SLF4J 的简单实现，输出到控制台
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# ============================================================================
# Ktor Client
# ============================================================================
# Ktor 客户端核心：提供 HTTP 客户端的基础 API，支持多平台
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
# Ktor 内容协商：自动处理请求和响应的序列化/反序列化
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
# Ktor Kotlinx JSON 序列化：使用 kotlinx.serialization 进行 JSON 序列化
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# Ktor Android 客户端引擎：为 Android 平台提供基于 OkHttp 的 HTTP 客户端引擎
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
# Ktor Darwin 客户端引擎：为 iOS/macOS 平台提供基于 NSURLSession 的 HTTP 客户端引擎
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
# Ktor CIO 客户端引擎：为 JVM 平台提供基于协程的异步 HTTP 客户端引擎
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
# Ktor JS 客户端引擎：为 Web 平台提供基于 Fetch API 的 HTTP 客户端引擎
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
# Ktor 客户端日志：提供 HTTP 请求和响应的日志记录功能
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
# Ktor 客户端 Mock：提供用于测试的 HTTP 客户端 Mock 实现
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# ============================================================================
# Ktor Server
# ============================================================================
# Ktor 服务器核心：提供 HTTP 服务器的基础 API，包括路由、请求处理等
ktor-serverCore = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
# Ktor Netty 服务器引擎：基于 Netty 的高性能异步 HTTP 服务器引擎
ktor-serverNetty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
# Ktor 服务器内容协商：自动处理请求和响应的序列化/反序列化
ktor-serverContentNegotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
# Ktor 服务器 CORS：提供跨域资源共享（CORS）支持
ktor-serverCors = { module = "io.ktor:ktor-server-cors-jvm", version.ref = "ktor" }
# Ktor 服务器调用日志：记录服务器接收的 HTTP 请求和响应日志
ktor-serverCallLogging = { module = "io.ktor:ktor-server-call-logging-jvm", version.ref = "ktor" }
# Ktor 服务器状态页：提供自定义错误页面和状态码处理
ktor-serverStatusPages = { module = "io.ktor:ktor-server-status-pages-jvm", version.ref = "ktor" }
# Ktor 服务器测试主机：提供用于测试的嵌入式 HTTP 服务器
ktor-serverTestHost = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor" }
# Logback 日志框架：Java 日志框架，提供灵活的日志配置和输出
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# ============================================================================
# Firebase
# ============================================================================
# Firebase Analytics（多平台）：提供跨平台的 Firebase Analytics 集成，支持事件追踪和用户分析
firebase-analytics = { module = "dev.gitlive:firebase-analytics", version.ref = "firebase-analytics" }
# Firebase BOM：Firebase 依赖的版本管理，统一管理所有 Firebase 库的版本
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }

# ============================================================================
# Umeng (友盟)
# ============================================================================
# 友盟通用 SDK：提供友盟统计、推送等功能的通用基础库
umeng-common = { module = "com.umeng.umsdk:common", version.ref = "umeng-common" }
# 友盟 ASMS：友盟应用安全监控服务，提供应用安全防护和监控功能
umeng-asms = { module = "com.umeng.umsdk:asms", version.ref = "umeng-asms" }

[plugins]
# ============================================================================
# Android Plugins
# ============================================================================
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidLint = { id = "com.android.lint", version.ref = "agp" }

# ============================================================================
# Kotlin Plugins
# ============================================================================
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# ============================================================================
# Compose Plugins
# ============================================================================
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }

# ============================================================================
# Other Plugins
# ============================================================================
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServicesVersion" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }

# ============================================================================
# MyHub Custom Plugins
# ============================================================================
myhub-kmp = { id = "myhub-kmp" }
myhub-kmp-android = { id = "myhub-kmp-android" }
myhub-kmp-ios = { id = "myhub-kmp-ios" }
myhub-kmp-jvm = { id = "myhub-kmp-jvm" }
myhub-kmp-js = { id = "myhub-kmp-js" }
myhub-kmp-wasmJs = { id = "myhub-kmp-wasmJs" }
myhub-kmp-web = { id = "myhub-kmp-web" }
myhub-android = { id = "myhub-android" }
